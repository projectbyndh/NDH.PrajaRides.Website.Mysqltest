# nginx site for Praja Ride on the Hostinger VPS: /etc/nginx/sites-available/prajaride
# Replace prajaride.com with the real domain, then: certbot --nginx -d prajaride.com -d www.prajaride.com

server {
    listen 80;
    server_name prajaride.com www.prajaride.com;
    return 301 https://prajaride.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.prajaride.com;
    # ssl_certificate lines are added by certbot
    return 301 https://prajaride.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name prajaride.com;
    # ssl_certificate lines are added by certbot

    # Driver applications carry up to 6 photos (resized in the browser, ~4 MB in total).
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Built JS/CSS never change for a given build.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # the app reads the visitor's IP from here
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;          # pages stream in as they render
        proxy_read_timeout 120s;      # photo uploads to object storage can take a while
    }
}
